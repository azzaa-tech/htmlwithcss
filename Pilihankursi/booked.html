<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemesanan Tiket Bioskop</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #113F67, #79A3B1, #F5E6CC, #FFE9A0, #FCA17D);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .form-container {
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 350px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #113F67;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input,
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
      outline: none;
      transition: 0.3s ease;
    }

    input:focus,
    select:focus {
      border-color: #79A3B1;
      box-shadow: 0 0 4px rgba(121, 163, 177, 0.5);
    }

    .error {
      color: red;
      font-size: 12px;
    }

    .preview {
      margin-top: 15px;
      background: #F5E6CC;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      color: #113F67;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background-color: #113F67;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #79A3B1;
    }
  </style>
</head>

<body>
  <div class="form-container">
    <h2>🎟️ Pemesanan Tiket</h2>
    <form id="pemesanan_tiket">
      <label>Nama</label>
      <input type="text" id="nama">
      <p class="error" id="error-nama"></p>

      <label>Email</label>
      <input type="email" id="email">
      <p class="error" id="error-email"></p>

      <label>Pilihan Film</label>
      <select id="film">
        <option value="">-- Pilih Film --</option>
        <option value="Inside Out 2">Inside Out 2</option>
        <option value="Avatar 3">Avatar 3</option>
        <option value="Moana 2">Moana 2</option>
      </select>
      <p class="error" id="error-film"></p>

      <label>Jumlah Tiket</label>
      <input type="number" id="jumlah" min="1" max="10">
      <p class="error" id="error-jumlah"></p>

      <div class="preview">
        Total Harga: Rp <span id="total">0</span>
      </div>

      <button type="submit">Pesan</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("pemesanan_tiket");
    const hargaTiket = 50000;

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const nama = document.getElementById("nama").value.trim();
      const email = document.getElementById("email").value.trim();
      const film = document.getElementById("film").value;
      const jumlah = Number(document.getElementById("jumlah").value);
      const total = document.getElementById("total");

      // Hitung total harga
      total.textContent = (jumlah >= 1 && jumlah <= 10) ? jumlah * hargaTiket : 0;

      // Cek semua input
      if (!nama || !email.includes("@") || !film || jumlah < 1 || jumlah > 10) {
        alert("Isi semua data dengan benar!");
        return;
      }

      alert(`Pesanan berhasil!
Nama: ${nama}
Film: ${film}
Jumlah: ${jumlah}
Total: Rp ${jumlah * hargaTiket}`);

      form.reset();
      total.textContent = 0;
    });
  </script>
</body>

</html>
